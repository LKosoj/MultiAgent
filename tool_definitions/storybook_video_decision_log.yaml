name: storybook_video_decision_log_tool
description: "Сохраняет decision_log.json с решениями по provider/model/runtime для storybook video"
category: "storybook"
source_type: custom_function
implementation_source: custom_tools.storybook.video_contract.storybook_video_decision_log_tool
parameters:
  - name: "session_id"
    type: "str"
    description: "Идентификатор сессии для трассировки выполнения"
    required: true
  - name: "project_id"
    type: "str"
    description: "Идентификатор storybook проекта"
    required: true
  - name: "language"
    type: "str"
    description: "Язык проекта"
    required: false
    default: "ru"
  - name: "approved"
    type: "bool"
    description: "Если True, помечает решения как явно подтвержденные"
    required: false
    default: false
