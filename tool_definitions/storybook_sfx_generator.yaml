name: storybook_sfx_generator_tool
description: "Generates scene SFX MP3 files with llmgateway/small-sfx and registers them in audio_manifest.json"
category: storybook
source_type: custom_function
implementation_source: custom_tools.storybook.sfx_generator.storybook_sfx_generator_tool
parameters:
  - name: session_id
    type: str
    description: "Execution session identifier"
    required: true
  - name: project_id
    type: str
    description: "Storybook project identifier"
    required: true
  - name: language
    type: str
    description: "Language stored in the SFX manifest"
    required: false
  - name: enable
    type: bool
    description: "Generate or reuse the scene sound effects"
    required: false
