name: blockout_scene_builder_tool
description: "Builds the 3D blockout scene spec (chains, camera, asset_map) from shots.json and screenplay.json for the Blender Workbench reference layer"
category: "storybook"
source_type: custom_function
implementation_source: custom_tools.storybook.blockout_scene_builder.blockout_scene_builder_tool
parameters:
  - name: session_id
    type: str
    description: "Execution trace/session identifier"
    required: true
  - name: project_id
    type: str
    description: "Storybook project identifier"
    required: true
  - name: language
    type: str
    description: "Bible language code, used for the asset-matching LLM prompt"
    required: false
  - name: fps
    type: int
    description: "Blockout frame rate; must be an integer (blockout_fps)"
    required: false
  - name: allowed_durations
    type: list
    description: "Optional narrowing of the video model's supported shot durations"
    required: false
  - name: resolution
    type: str
    description: "Requested blockout resolution, e.g. '1280x720'"
    required: false
  - name: enable
    type: bool
    description: "If true, builds the blockout scene spec; if false, returns the zero contract without touching 93_blockout/"
    required: false
