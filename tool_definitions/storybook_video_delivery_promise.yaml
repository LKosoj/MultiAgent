name: storybook_video_delivery_promise_tool
description: "Фиксирует delivery promise для storybook motion-led video и блокирует запуск при отсутствии capabilities"
category: "storybook"
source_type: custom_function
implementation_source: custom_tools.storybook.video_contract.storybook_video_delivery_promise_tool
parameters:
  - name: "session_id"
    type: "str"
    description: "Идентификатор сессии для трассировки выполнения"
    required: true
  - name: "project_id"
    type: "str"
    description: "Идентификатор storybook проекта"
    required: true
  - name: "language"
    type: "str"
    description: "Язык проекта"
    required: false
    default: "ru"
  - name: "enable"
    type: "bool"
    description: "Если True, видео должно быть сгенерировано или явно заблокировано"
    required: false
    default: true
