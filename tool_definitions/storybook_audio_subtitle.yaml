name: storybook_audio_subtitle_tool
description: "Creates first-class subtitle/audio planning artifacts for a storybook project without calling external TTS"
category: "storybook"
source_type: custom_function
implementation_source: custom_tools.storybook.audio_subtitle.storybook_audio_subtitle_tool
parameters:
  - name: session_id
    type: str
    description: "Execution trace/session identifier"
    required: true
  - name: project_id
    type: str
    description: "Storybook project identifier"
    required: true
  - name: language
    type: str
    description: "Subtitle language code"
    required: false
  - name: enable
    type: bool
    description: "If true, writes subtitle and audio planning artifacts; if false, skips execution"
    required: false
  - name: allow_missing_subtitles
    type: bool
    description: "If false (default), zero subtitle cues is a hard error; if true, an empty cue set succeeds with a no_subtitle_cues warning"
    required: false
