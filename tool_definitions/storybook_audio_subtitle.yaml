name: storybook_audio_subtitle_tool
description: "Creates series subtitle/audio artifacts from retained measured speech without calling TTS again"
category: "storybook"
source_type: custom_function
implementation_source: custom_tools.storybook.audio_subtitle.storybook_audio_subtitle_tool
parameters:
  - name: series_id
    type: str
    description: "Series identifier within the project"
    required: true
  - name: session_id
    type: str
    description: "Execution trace/session identifier"
    required: true
  - name: project_id
    type: str
    description: "Storybook project identifier"
    required: true
  - name: language
    type: str
    description: "Subtitle language code"
    required: false
  - name: enable
    type: bool
    description: "If true, writes subtitle and audio planning artifacts; if false, skips execution"
    required: false
  - name: generate_subtitles
    type: bool
    description: "If false, subtitles.srt is not written and missing cues are not an error; cue sheet and audio manifest are still produced"
    required: false
