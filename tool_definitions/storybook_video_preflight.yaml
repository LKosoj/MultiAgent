name: storybook_video_preflight_tool
description: "Проверяет storybook video/audio/render capabilities и сохраняет provider_menu_summary.json"
category: "storybook"
source_type: custom_function
implementation_source: custom_tools.storybook.video_contract.storybook_video_preflight_tool
parameters:
  - name: "session_id"
    type: "str"
    description: "Идентификатор сессии для трассировки выполнения"
    required: true
  - name: "project_id"
    type: "str"
    description: "Идентификатор storybook проекта"
    required: true
  - name: "language"
    type: "str"
    description: "Язык проекта"
    required: false
    default: "ru"
  - name: "enable"
    type: "bool"
    description: "Флаг включения генерации видео для текущего запуска"
    required: false
    default: true
