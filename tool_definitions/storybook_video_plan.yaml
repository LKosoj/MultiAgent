name: storybook_video_plan_tool
description: Classify action shots, plan reference fragments and select necessary storyboard images before rendering.
category: Storybook
source_type: custom_function
implementation_source: custom_tools.storybook.video_plan.storybook_video_plan_tool
parameters:
  - name: shot_keys
    type: list
    description: Optional source shot keys to replan without replacing other existing video units.
    required: false
  - name: shots_data
    type: dict
    description: Checked frame tasks with character-state references.
    required: false
  - name: session_id
    type: str
    description: Execution identifier.
    required: true
  - name: project_id
    type: str
    description: Storybook project identifier.
    required: true
  - name: enable
    type: bool
    description: Whether to plan video generation.
    required: false
  - name: language
    type: str
    description: Project prompt language.
    required: false
