name: music_planner_tool
description: "Plans per-scene leitmotif music (max 2 or 3 by film duration) and writes 98_audio/music_plan.json consumed by storybook_music_generator_tool"
category: "storybook"
source_type: custom_function
implementation_source: custom_tools.storybook.music_planner.music_planner_tool
parameters:
  - name: session_id
    type: str
    description: "Execution trace/session identifier"
    required: true
  - name: project_id
    type: str
    description: "Storybook project identifier"
    required: true
  - name: language
    type: str
    description: "Source language code stored in generated metadata"
    required: false
