name: storybook_continuity_images_review_tool
description: "Проверяет изображения кадров на физическую непрерывность объектов и ориентиров"
category: "Контроль качества"
source_type: custom_function
implementation_source: custom_tools.storybook.continuity_review.storybook_continuity_images_review_tool
parameters:
  - name: session_id
    type: str
    required: true
    description: "Идентификатор сессии"
  - name: project_id
    type: str
    required: true
    description: "Идентификатор проекта"
  - name: enable
    type: bool
    required: false
    description: "Включить проверку изображений"
  - name: review_findings
    type: list
    required: false
    description: "Замечания к текущим изображениям с точным frame_key; проверяются по исходнику и пикселям"
