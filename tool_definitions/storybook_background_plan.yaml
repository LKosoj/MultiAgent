name: storybook_background_plan_tool
description: "Планирует виды окружения и привязки кадров по локациям без генерации изображений"
category: "Генерация"
source_type: custom_function
implementation_source: custom_tools.storybook.background_references.storybook_background_plan_tool
parameters:
  - name: session_id
    type: str
    required: true
    description: "Идентификатор сессии"
  - name: project_id
    type: str
    required: true
    description: "Идентификатор проекта"
  - name: shots_data
    type: dict
    required: false
    description: "Проверенные задания кадров; по умолчанию shots.json"
  - name: language
    type: str
    required: false
    description: "Язык проекта"
  - name: enable
    type: bool
    required: false
    description: "Включить планирование окружения"
