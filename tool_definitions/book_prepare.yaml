name: book_prepare_tool
description: "Извлекает книгу, делит её на главы и создаёт план пересказа со словарём терминов"
category: "Книги"
source_type: custom_function
implementation_source: custom_tools.book_summary.pipeline.book_prepare_tool
parameters:
  - name: "session_id"
    type: "str"
    description: "Идентификатор сессии"
    required: true
  - name: "source_path"
    type: "str"
    description: "Путь к исходной книге PDF или EPUB"
    required: true
  - name: "output_dir"
    type: "str"
    description: "Каталог материалов подготовки"
    required: true
