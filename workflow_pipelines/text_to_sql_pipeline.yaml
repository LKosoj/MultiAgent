name: text_to_sql_pipeline
version: '2.0'
description: 'Typed Text-to-SQL: исследование схемы, решение и выполнение SQL'
parallel_execution: false

pipeline:
  requires_enhanced_engine: true

inputs:
  query: ''
  dsn: ''
  max_rows: 100
  session_id: ''
  run_id: ''
  safety_level: strict
  safety_policy: null
  schema_scope: null
  include_explanation: true
  validate_schema: true
  dry_run_only: false

outputs:
  final:
    from_step: db_audit
    field: output
    format: json
  research:
    from_step: schema_research
    field: output
    format: json
  sql:
    from_step: sql_solving
    field: output
    format: json

global_retry_policy:
  max_retries: 0
  backoff_strategy: exponential
  base_delay: 1.0
  max_delay: 60.0
  retry_on_errors:
    - network_error
    - rate_limit
    - timeout

global_resource_limits:
  max_duration_seconds: 14400
  max_api_calls_per_minute: 20
  max_concurrent_steps: 1

steps:
  - id: schema_research
    step_type: tool
    tool_name: typed_schema_research
    task: 'Исследовать структуру и данные базы до достаточного понимания запроса'
    retry_policy:
      max_retries: 0
    resource_limits:
      max_duration_seconds: 14400

  - id: sql_solving
    step_type: agent
    agent_type: sql_solver_agent
    output_schema: json_object
    output_schema_requirements:
      required:
        - sql
        - description
    condition: '{schema_research.ready_for_sql}'
    task: 'Построить и проверить SQL с помощью Typed solver loop'
    depends_on:
      - schema_research
    retry_policy:
      max_retries: 0
    metadata:
      pipeline_type: text_to_sql
      max_rows: '{max_rows}'
      safety_policy: '{safety_policy}'
      skip_output:
        sql: ''
        description: 'Typed research did not authorize SQL solving'

  - id: db_audit
    step_type: tool
    tool_name: finalize_text_to_sql_run
    output_schema: json_object
    condition: '{sql_solving.sql} != ""'
    task: 'Проверить свежесть, безопасно выполнить SQL и сформировать результат'
    tool_params:
      sql_query: '{sql_solving.sql}'
      user_query: '{query}'
      dsn: '{dsn}'
      row_limit: '{max_rows}'
      dry_run_only: '{dry_run_only}'
      session_id: '{session_id}'
      run_id: '{run_id}'
      safety_policy: '{safety_policy}'
      namespace_version_key: '{schema_research.namespace_version_key}'
    depends_on:
      - sql_solving
    retry_policy:
      max_retries: 0
    metadata:
      pipeline_type: text_to_sql
      dsn: '{dsn}'
      session_id: '{session_id}'
      run_id: '{run_id}'
      safety_level: '{safety_level}'
      safety_policy: '{safety_policy}'
      include_explanation: '{include_explanation}'
      validate_schema: '{validate_schema}'
      dry_run_only: '{dry_run_only}'

error_handling:
  on_failure: fail
  auto_retry_transient: true
  save_partial_results: false
  checkpoint_strategy: after_each_step
  save_checkpoint_interval: 60

metadata:
  agui_entrypoint: presets.text_to_sql.generate
  forbid_workflows_start: true
  author: System
  category: text_to_sql
  engine_type: enhanced
  tags:
    - text_to_sql
    - typed
