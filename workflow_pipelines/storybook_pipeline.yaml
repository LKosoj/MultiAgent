name: storybook_pipeline
version: '0.1'
description: 'Универсальный пайплайн детской сказки: от брифа до PDF'
parallel_execution: true
max_parallel_steps: 5
pipeline:
  requires_enhanced_engine: true
inputs:
  task: 'Книга о храбром коте-рыцаре в сияющих доспехах, который защищает своё королевство от злого волшебника. Дружелюбная сказка с приключениями для детей 6-8 лет. Главные герои: кот-рыцарь и принцесса. Антогонисты: злой волшебник.'
  project_id: storybook_project
  pages_min: 1
  pages_max: 2
  words_per_page_min: 200
  words_per_page_max: 300
  generate_screenplay: true
  generate_end_shots: true
  language: ru
  screenplay_time: 120
  generate_blockout: true
  blockout_fps: 24
  blockout_resolution: '1280x720'
  blockout_allowed_durations: []
  blockout_jobs: 0                    # 0 = cpu_count - 1
  blockout_scope: all
  blockout_preview_burnin: true
  blockout_use_as_image_reference: true
  blockout_use_as_video_reference: true
  force_update_prompts: false
  skip_prompt_enhancement: true  # Если true, видео-промпт только переводится без "улучшений" LLM
  sample_before_batch: false
  sample_shot_key: ''
  generate_music: true
  final_allow_missing_audio: false
global_retry_policy:
  max_retries: 2
  backoff_strategy: exponential
  base_delay: 1.0
  max_delay: 300.0
  retry_on_errors:
  - network_error
  - rate_limit
  - timeout
global_resource_limits:
  max_api_calls_per_minute: 15
steps:
- id: brief_from_prompt
  step_type: tool
  task: Generate brief JSON from a free-form storybook prompt
  timeout: 120
  tool_name: brief_from_prompt_tool
  tool_params:
    session_id: '{session_id}'
    project_id: '{project_id}'
    storybook_prompt: '{task}'
    pages_min: '{pages_min}'
    pages_max: '{pages_max}'
    words_per_page_min: '{words_per_page_min}'
    words_per_page_max: '{words_per_page_max}'
    language: '{language}'
- id: init_project
  step_type: tool
  task: Init project structure and save 00_brief.json
  timeout: 120
  tool_name: project_init_tool
  tool_params:
    session_id: '{session_id}'
    project_id: '{project_id}'
    brief: '{brief_from_prompt}'
  depends_on:
  - brief_from_prompt
- id: story_planner
  step_type: tool
  task: Generate synopsis.json and beats.json
  timeout: 120
  tool_name: story_planner_tool
  tool_params:
    session_id: '{session_id}'
    project_id: '{project_id}'
    task: '{task}'
  depends_on:
  - init_project
- id: bible_builder
  step_type: tool
  task: Build characters/locations canon and rules
  timeout: 120
  tool_name: bible_builder_tool
  tool_params:
    session_id: '{session_id}'
    project_id: '{project_id}'
    language: '{language}'
  depends_on:
  - story_planner
- id: style_keeper
  step_type: tool
  task: Fix style for text and images and negative list
  timeout: 120
  tool_name: style_keeper_tool
  tool_params:
    session_id: '{session_id}'
    project_id: '{project_id}'
  depends_on:
  - bible_builder
- id: story_writer
  step_type: tool
  task: Generate story.json with per-page text
  timeout: 120
  tool_name: story_writer_tool
  tool_params:
    session_id: '{session_id}'
    project_id: '{project_id}'
    language: '{language}'
  depends_on:
  - style_keeper
- id: story_editor
  step_type: tool
  task: Edit and improve story text if it was regenerated
  timeout: 180
  tool_name: story_editor_tool
  tool_params:
    session_id: '{session_id}'
    project_id: '{project_id}'
  depends_on:
  - story_writer
  condition: '{story_writer.regenerated}'
- id: prompt_engineer
  step_type: tool
  task: Create per-page EN prompts with references and technical params
  timeout: 120
  tool_name: prompt_engineer_tool
  tool_params:
    session_id: '{session_id}'
    project_id: '{project_id}'
    language: '{language}'
  depends_on:
  - story_editor
- id: items_builder
  step_type: tool
  task: Prepare batch items for artist agent
  timeout: 120
  tool_name: items_for_artist_tool
  tool_params:
    session_id: '{session_id}'
    project_id: '{project_id}'
    language: '{language}'
  depends_on:
  - prompt_engineer
- id: artist_batch
  step_type: tool
  task: Parallel artist edits with references for final images
  timeout: 120
  tool_name: artist_agent_batch_edit_tool
  tool_params:
    session_id: '{session_id}'
    items: '{items_builder}'
    language: '{language}'
  depends_on:
  - items_builder
- id: assemble_md
  step_type: tool
  task: Assemble universal Markdown with image links
  timeout: 120
  tool_name: md_assembler_tool
  tool_params:
    session_id: '{session_id}'
    mode: 'discovery'
    output_path: 'plots/storybooks/{project_id}/90_md/book.md'
    image_globs: ['plots/storybooks/{project_id}/50_images/**/img_final.png']
    story_json_path: 'plots/storybooks/{project_id}/20_story/story.json'
    text_mode: 'body'
    title: '{brief_from_prompt.title}'
    skip_if_exists: true
  depends_on:
  - artist_batch
  - story_editor
- id: md_to_pdf
  step_type: tool
  task: Convert Markdown book.md to PDF book.pdf
  timeout: 120
  tool_name: md_to_pdf_tool
  tool_params:
    session_id: '{session_id}'
    md_path: 'plots/storybooks/{project_id}/90_md/book.md'
    pdf_path: 'plots/storybooks/{project_id}/95_pdf/book.pdf'
    css_path: 'doc/storybook_pdf.css'
    skip_if_up_to_date: true
    page_size: 'A4'
    margins: '14mm'
  depends_on:
  - assemble_md
- id: screenplay_generator
  step_type: tool
  task: Generate director's screenplay in JSON format
  timeout: 360
  tool_name: screenplay_generator_tool
  tool_params:
    session_id: '{session_id}'
    project_id: '{project_id}'
    screenplay_time: '{screenplay_time}'
    enable: '{generate_screenplay}'
  depends_on:
  - story_editor
- id: screenplay_shots_generator
  step_type: tool
  task: Generate shots JSON for storyboard frames
  timeout: 600
  tool_name: screenplay_shots_generator_tool
  tool_params:
    session_id: '{session_id}'
    project_id: '{project_id}'
    language: '{language}'
    generate_end_shots: '{generate_end_shots}'
    enable: '{generate_screenplay}'
    generate_blockout: '{generate_blockout}'
    allowed_durations: '{blockout_allowed_durations}'
    screenplay_time: '{screenplay_time}'
    #enable: false
  depends_on:
  - screenplay_generator
- id: shots_prompt_qa
  step_type: tool
  task: LLM validate+repair shots prompts vs screenplay BEFORE generating shot images
  timeout: 600
  tool_name: shots_prompt_qa_tool
  tool_params:
    session_id: '{session_id}'
    project_id: '{project_id}'
    shots_data: '{screenplay_shots_generator}'
    enable: '{generate_screenplay}'
    model: 'ultimate'
    temperature: 0.1
  depends_on:
  - screenplay_shots_generator
- id: blockout_scene_builder
  step_type: tool
  task: Build 3D blockout scene spec from shots and screenplay
  timeout: 3600
  tool_name: blockout_scene_builder_tool
  output_schema: json_object
  output_schema_requirements:
    required:
    - status
    - chains_total
    - shots_total
    - unmapped_assets
    - artifact_path
  metadata:
    retryable: false
    output_artifacts:
    - 93_blockout/chains.json
    - 93_blockout/scene_spec.json
    - 93_blockout/asset_map.json
    - 93_blockout/report.json
  tool_params:
    session_id: '{session_id}'
    project_id: '{project_id}'
    language: '{language}'
    fps: '{blockout_fps}'
    allowed_durations: '{blockout_allowed_durations}'
    resolution: '{blockout_resolution}'
    enable: '{generate_blockout}'
  depends_on:
  - shots_prompt_qa
  condition: '{generate_screenplay}'
- id: blockout_renderer
  step_type: tool
  task: Render blockout frames and reference videos with Blender Workbench
  timeout: 9000
  tool_name: blockout_renderer_tool
  output_schema: json_object
  output_schema_requirements:
    required:
    - status
    - shots_rendered
    - frames_total
    - junction_checks
    - artifact_path
  metadata:
    retryable: true
  tool_params:
    session_id: '{session_id}'
    project_id: '{project_id}'
    fps: '{blockout_fps}'
    resolution: '{blockout_resolution}'
    jobs: '{blockout_jobs}'
    scope: '{blockout_scope}'
    enable: '{generate_blockout}'
  depends_on:
  - blockout_scene_builder
  condition: '{generate_screenplay}'
- id: blockout_preview
  step_type: tool
  task: Stitch blockout segments into a single preview video
  timeout: 600
  tool_name: blockout_preview_tool
  metadata:
    output_artifacts:
    - 93_blockout/preview/blockout_all.mp4
    - 93_blockout/preview/contact_sheet.png
  tool_params:
    session_id: '{session_id}'
    project_id: '{project_id}'
    burnin: '{blockout_preview_burnin}'
    enable: '{generate_blockout}'
  depends_on:
  - blockout_renderer
  condition: '{generate_screenplay}'
- id: artist_batch_shots
  step_type: tool
  task: Parallel artist edits with references for final shots images
  timeout: 1200
  tool_name: artist_agent_batch_edit_tool
  tool_params:
    session_id: '{session_id}'
    items: '{shots_prompt_qa}'
    language: '{language}'
    enable: '{generate_screenplay}'
    #enable: false
    use_blockout_reference: '{blockout_use_as_image_reference}'
    generate_blockout: '{generate_blockout}'
  depends_on:
  - shots_prompt_qa
  - artist_batch
  - blockout_renderer
- id: storybook_video_preflight
  step_type: tool
  task: Preflight storybook video/audio/render provider capabilities
  timeout: 120
  tool_name: storybook_video_preflight_tool
  output_schema: json_object
  output_schema_requirements:
    required:
    - status
    - provider
    - generation_enabled
    - items_total
    - artifact_path
  tool_params:
    session_id: '{session_id}'
    project_id: '{project_id}'
    language: '{language}'
    enable: '{generate_screenplay}'
    use_blockout_reference: '{blockout_use_as_video_reference}'
    generate_blockout: '{generate_blockout}'
  depends_on:
  - shots_prompt_qa
- id: storybook_video_delivery_promise
  step_type: tool
  task: Lock delivery promise for storybook motion-led video
  timeout: 120
  tool_name: storybook_video_delivery_promise_tool
  output_schema: json_object
  output_schema_requirements:
    required:
    - status
    - will_generate_video
    - expected_video_count
    - expected_outputs
    - blocking_reasons
    - artifact_path
  tool_params:
    session_id: '{session_id}'
    project_id: '{project_id}'
    language: '{language}'
    enable: '{generate_screenplay}'
    use_blockout_reference: '{blockout_use_as_video_reference}'
    generate_blockout: '{generate_blockout}'
  depends_on:
  - storybook_video_preflight
  - artist_batch_shots
- id: video_generator
  step_type: tool
  task: Generate video from shots
  timeout: 1200
  # Дорогой side-effect-шаг: движковый retry запрещён до появления настоящей
  # идемпотентности (полагаемся на provider_jobs.json), иначе слепой повтор
  # пере-триггерит платную генерацию. См. H-2.
  metadata:
    retryable: false
#  tool_name: video_generator_veo_tool
#  tool_name: video_generator_mm_tool
  tool_name: video_generator_aitunnel_tool
  tool_params:
    session_id: '{session_id}'
    project_id: '{project_id}'
    language: '{language}'
    force_update_prompts: '{force_update_prompts}'
    skip_prompt_enhancement: '{skip_prompt_enhancement}'
    sample_before_batch: '{sample_before_batch}'
    sample_shot_key: '{sample_shot_key}'
    enable: '{generate_screenplay}'
    use_blockout_reference: '{blockout_use_as_video_reference}'
    generate_blockout: '{generate_blockout}'
  depends_on:
  - storybook_video_delivery_promise
  - artist_batch_shots
- id: storybook_audio_subtitle
  step_type: tool
  task: Prepare first-class audio manifest and subtitles for final montage
  timeout: 180
  tool_name: storybook_audio_subtitle_tool
  output_schema: json_object
  output_schema_requirements:
    required:
    - status
    - subtitles_path
    - audio_manifest_path
    - cue_sheet_path
  tool_params:
    session_id: '{session_id}'
    project_id: '{project_id}'
    language: '{language}'
    enable: '{generate_screenplay}'
  depends_on:
  - video_generator
- id: storybook_music_generator
  step_type: tool
  task: Generate or reuse background music and register it in audio manifest
  timeout: 900
  # Дорогой side-effect-шаг: движковый retry запрещён (идемпотентность на уровне
  # тула через music-манифест). См. H-2.
  metadata:
    retryable: false
  tool_name: storybook_music_generator_tool
  output_schema: json_object
  output_schema_requirements:
    required:
    - status
    - music_manifest_path
    - music_path
  tool_params:
    session_id: '{session_id}'
    project_id: '{project_id}'
    language: '{language}'
    enable: '{generate_music}'
    provider: suno
    instrumental: true
    wait_for_completion: true
  depends_on:
  - storybook_audio_subtitle
  condition: '{generate_screenplay}'
- id: montage_assembler
  step_type: tool
  task: Assemble final video, timeline, subtitles, manifest and final review
  timeout: 1200
  # Дорогой side-effect-шаг (ffmpeg-рендер): движковый retry запрещён, повтор
  # рендерит заново без выигрыша. См. H-2.
  metadata:
    retryable: false
  tool_name: montage_assembler_tool
  output_schema: json_object
  output_schema_requirements:
    required:
    - status
    - final_video_path
    - timeline_path
    - subtitles_path
    - manifest_path
    - final_review_path
  tool_params:
    session_id: '{session_id}'
    project_id: '{project_id}'
    language: '{language}'
    enable: '{generate_screenplay}'
    allow_missing_audio: '{final_allow_missing_audio}'
    music_enabled: '{generate_music}'
  depends_on:
  - storybook_music_generator
- id: storybook_video_decision_log
  step_type: tool
  task: Persist storybook video provider/model/runtime decisions and final status
  timeout: 120
  tool_name: storybook_video_decision_log_tool
  output_schema: json_object
  output_schema_requirements:
    required:
    - status
    - decisions
    - final_video_status
    - artifact_path
  tool_params:
    session_id: '{session_id}'
    project_id: '{project_id}'
    language: '{language}'
    approved: false
  depends_on:
  - montage_assembler
error_handling:
  on_failure: stop
  auto_retry_transient: true
  save_partial_results: true
  checkpoint_strategy: after_each_step
metadata:
  author: Pipeline Constructor
  category: general
  estimated_duration: 25-35 minutes
  complexity: complex
  engine_type: enhanced
  tags:
  - constructed
  - general
  - engine_enhanced
