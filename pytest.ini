[pytest]
addopts = -m "not db_integration"
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore::DeprecationWarning:pydantic._internal._fields
    ignore::DeprecationWarning:matplotlib\._fontconfig_pattern
    ignore::DeprecationWarning:matplotlib\._mathtext
# Root/app-local test*.py files are manual smoke scripts with local services,
# GUI imports, or absolute fixtures. Default pytest runs the maintained
# regression suite; run scripts/run_manual_smoke_tests.sh for the explicit
# manual-smoke target.
testpaths =
    tests
markers =
    db_integration: protected real-driver lane; opt in with -m db_integration and required DSN evidence
    host_integration: explicit local-host benchmark sandbox integration lane
