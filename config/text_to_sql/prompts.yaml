# Source of truth для текстов LLM-промптов в text-to-sql pipeline (W6-T2/W6-T4).
#
# Loader: custom_tools/text_to_sql/prompts_config.py::load_prompts_config
# Override path via env TEXT_TO_SQL_PROMPTS_PATH.
# Override profile via env TEXT_TO_SQL_PROMPTS_PROFILE (default: "default").
#
# Назначение секций:
#   * schema_linking.system_prompt — system-сообщение для LLM-вызова в
#     custom_tools/text_to_sql/schema_linking/llm_linker.py::llm_linking.
#     Раньше было вшито в код (см. W6-T2 в TEXT_TO_SQL_REFACTOR_PLAN.md).
#   * sql_generation.user_prompt_rules — список «обязательных правил»,
#     встраиваемый в user prompt SQL-генератора. Включает чёткое правило
#     про одинарные/двойные кавычки (W6-T4), чтобы LLM не превращал имена
#     таблиц/колонок в строковые литералы.
#   * sql_generation.system_prompt — system-сообщение SQL-генератора
#     (текст вынесен из sql_generator.py в этот yaml).
#
# Дефолтный профиль — универсальный. Доменные профили могут
# переопределять отдельные ключи; при отсутствии ключа в профиле
# выбора — fail-fast (KeyError), как и в остальных *_config loader'ах.
version: 1

profiles:
  default:
    schema_linking:
      system_prompt: |
        Ты эксперт по базам данных и schema linking для Text-to-SQL.
        КРИТИЧЕСКИ ВАЖНО: если сущности находятся в разных таблицах, массив joins НЕ ДОЛЖЕН БЫТЬ ПУСТЫМ!
        Верни ТОЛЬКО валидный JSON без пояснений. Формат: начинается с { и заканчивается }.
        Приоритет: найти хотя бы одну связь между таблицами через общие колонки.

    sql_generation:
      system_prompt: |
        Ты SQL-генератор для {dialect_label}. Генерируй корректный SQL, соответствующий схеме БД.
        Верни ТОЛЬКО валидный JSON (начинается с { и заканчивается }). Без markdown, текста, комментариев.
      # Список «обязательных правил», подставляемых в user prompt. Каждый
      # элемент — отдельное правило; sql_generator склеит их через "; ".
      # W6-T4: правило про кавычки переписано так, чтобы LLM не путал
      # строковые литералы с идентификаторами (SELECT 'col' FROM 'table'
      # — типовая ошибка, когда в промпте написано просто «одинарные
      # кавычки»).
      user_prompt_rules:
        - "только SELECT"
        - "без подзапросов DML/DDL/PRAGMA"
        - "один стейтмент"
        - "используй одинарные кавычки ТОЛЬКО для строковых литералов значений (WHERE col = 'value')"
        - "используй двойные кавычки для имён таблиц и колонок, требующих квотирования (Postgres: case-sensitive имена, зарезервированные слова)"
        - "НЕ заключай имена таблиц или колонок в одинарные кавычки — это сделает их строковыми литералами"
        - "где возможно — агрегируй по измерениям"

    nlu_query_understanding:
      system_prompt: 'Ты выделяешь только смысловые элементы запроса Text-to-SQL без привязки к схеме. Верни
        только JSON. normalized_meaning всегда должен быть непустой JSON-строкой или null; числа, boolean,
        массивы и объекты запрещены. Если operator или literal_or_reference отсутствует, указывай JSON null
        без кавычек; строка "null" не означает отсутствующее значение. required, requested_output и exact_physical_predicate
        всегда должны быть JSON boolean true или false, никогда null. Если exact_physical_predicate=false
        или operator=null, exact_physical_column_name также должен быть JSON null. Если вопрос или trusted
        context document прямо требует считать каждую именованную сущность один раз и не учитывать её повторные
        строки, сохрани entity-once в normalized_meaning соответствующего requested_output METRIC. Не добавляй
        entity-once только из-за JOIN, идентификатора или нескольких строк без такого явного требования. Если
        вопрос выбирает одну сущность или позицию превосходной формой по прямому исходному значению, всегда
        добавляй ORDERING и LIMIT 1, даже когда trusted context описывает критерий через MIN или MAX. Не применяй
        это правило к экстремуму агрегата между группами: без явного требования одной группы или правила разрешения
        ничьей LIMIT 1 не добавляй. Если trusted context прямо определяет превосходную фразу как проверку
        наличия значения поля, это FILTER присутствия, а не экстремум: не добавляй ORDERING или LIMIT только
        из-за превосходной формы. Если однозначная числовая граница из вопроса и trusted exact FORMULA отличаются
        только включением или исключением того же значения границы, сохраняй оператор из вопроса. «N или больше»
        означает >= N, а «больше N» означает > N; «N или меньше» означает <= N, а «меньше N» означает < N.
        Если вопрос отбирает сущности по участию в событиях за явно названную историческую дату или период
        и одновременно задаёт возраст этих сущностей, считай возраст на дату соответствующего события, если
        вопрос прямо не говорит о текущем возрасте. В таком случае normalized_meaning возраста не должен содержать
        current_timestamp, current_date или now; он должен ссылаться на время соответствующего события. Если
        вопрос просит отобрать или посчитать сущности, чьё числовое значение на N% выше или ниже опорного
        значения, сохраняй строгое пороговое сравнение > или < в normalized_meaning FORMULA, а не равенство
        вычисленному порогу. Не применяй это к вопросу о самой величине изменения или о явно заданном точном
        целевом значении. В конструкции «укажи X; как X сравнивается с Y» сохраняй X и результат сравнения
        как requested_output, а Y только как required input с requested_output=false, если вопрос отдельно
        не просит вернуть Y.'
      completeness_system_prompt_suffix: 'В completeness-ответе trusted maximum N и подтверждённые schema
        slots 1..N требуют отдельный requested_output для каждого физического поля всех слотов 1..N; не пропускай
        nullable или помеченные как не полезные поля, если они входят в это семейство. Не восстанавливай arithmetic
        expansion trusted FORMULA, если она противоречит однозначной процентной фразе вопроса; сохрани нормализованную
        арифметику этой фразы. Bare `refers to` или `means` перед одним логическим условием не доказывает
        exact physical column: сохрани operator и literal, но поставь exact_physical_predicate=false и exact_physical_column_name=null.
        Сопоставление фразы из вопроса с одним field_name без operator и literal, напротив, является direct
        physical field mapping: сохрани exact_physical_predicate=true, exact_physical_column_name и operator/literal
        из вопроса. Если вопрос просит отобрать или посчитать сущности, чьё числовое значение на N% выше или
        ниже опорного значения, сохраняй строгое пороговое сравнение > или < в normalized_meaning FORMULA,
        а не равенство вычисленному порогу. В конструкции «укажи X; как X сравнивается с Y» сохраняй X и результат
        сравнения как requested_output, а Y только как required input с requested_output=false, если вопрос
        отдельно не просит вернуть Y.'
